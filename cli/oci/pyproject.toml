[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tuk"
version = "0.1.0"
description = "Terminal client for tuk-tuk"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Piwero" }]
dependencies = [
    "httpx>=0.27.0",
]

[project.scripts]
tuk = "tuk.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.17.1",
    "mypy>=2.3.1",
    # Test-only: lets the one integration test boot the real application
    # in-process. Never a runtime dependency — installing the CLI must not
    # pull in the database stack.
    "app",
]

[tool.uv.sources]
app = { path = "../../backend/oci", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["src/tuk"]

# ---- Ruff (mirrors backend/oci) ----
[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "UP",
    "SIM",
    "N",
    "C4",
    "PT",
    # Beyond the backend's set: the one deliberate catch-all here is the
    # Agenda's calendar failure isolation, which must stay deliberate. With
    # BLE unselected its `noqa` would be decoration, and the next broad
    # `except` would be added in silence.
    "BLE",
]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

# ---- Mypy (mirrors backend/oci) ----
[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unreachable = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# ---- Pytest ----
[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]

# ---- Coverage ----
[tool.coverage.run]
source = ["src/tuk"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false
