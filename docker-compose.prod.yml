# Self-hosting: builds the production images from source and serves the app
# on http://localhost:8080. See docs/self-hosting/install.md.
# ponytail: builds locally because the GHCR images are private; swap each
# `build:` for `image: ghcr.io/piwero/tuk-tuk/<service>:<version>` once public.
name: tuk-tuk-prod

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: tuktuk
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env (openssl rand -hex 24)}
      POSTGRES_DB: tuktuk
    # Not published: only the backend, on this Compose network, reaches it.
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuktuk -d tuktuk"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend/oci
      target: prod
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://tuktuk:${POSTGRES_PASSWORD}@postgres:5432/tuktuk
      APP_MASTER_KEY: ${APP_MASTER_KEY:?Set APP_MASTER_KEY in .env (openssl rand -base64 32)}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # Every address you open the app at; Google Calendar sign-in only returns to these.
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080"]}
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/oci/Dockerfile
      target: runtime
    restart: unless-stopped
    ports:
      - "${TUK_TUK_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  # Holds every row. `docker compose down -v` deletes it — back up first
  # (see docs/self-hosting/upgrade.md).
  pgdata:
