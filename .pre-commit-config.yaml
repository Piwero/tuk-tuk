# See https://pre-commit.com for usage and config.
# Run: pre-commit install (once) then hooks fire on every commit.
default_language_version:
  python: python3.12
  node: "20.11.1"

repos:
  # ---- Generic hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # ---- Python: ruff (lint + format) ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^(backend|cli|shared|mcp)/oci/
      - id: ruff-format
        files: ^(backend|cli|shared|mcp)/oci/

  # ---- Python: mypy ----
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend/oci && uv run mypy src'
        language: system
        files: ^backend/oci/src/
      - id: mypy-cli
        name: mypy (cli)
        entry: bash -c 'cd cli/oci && uv run mypy src'
        language: system
        files: ^(cli/oci/src/|shared/oci/src/)
      - id: mypy-shared
        name: mypy (shared)
        entry: bash -c 'cd shared/oci && uv run mypy src'
        language: system
        files: ^shared/oci/src/
      - id: mypy-mcp
        name: mypy (mcp)
        entry: bash -c 'cd mcp/oci && uv run mypy src'
        language: system
        files: ^(mcp/oci/src/|shared/oci/src/)

  # ---- Frontend: prettier ----
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/oci/.*\.(ts|tsx|js|jsx|json|css|scss|md|yaml|yml|html)$
        additional_dependencies:
          # Keep in lock-step with frontend/oci/package-lock.json, or the hook
          # and `npm run format:check` fight over formatting.
          - prettier@3.9.4

  # ---- Frontend: eslint ----
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.14.0
    hooks:
      - id: eslint
        files: ^frontend/oci/.*\.(ts|tsx|js|jsx)$
        args: ["--config", "frontend/oci/eslint.config.js"]
        additional_dependencies:
          - eslint@9.14.0
          - typescript@5.6.3
          - typescript-eslint@8.13.0
          - "@eslint/js@9.14.0"

  # ---- Commit message: conventional commits ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # ---- Secret scanning ----
  # Runs an installed gitleaks rather than the upstream hook, which compiles
  # the binary from source with cgo. On macOS with Go 1.22 and the current
  # Xcode linker that build produces a Mach-O binary with no LC_UUID that
  # dyld refuses to exec, so the upstream hook cannot run there at all. CI
  # installs gitleaks before running pre-commit; see the script for the
  # local install.
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: scripts/gitleaks-staged.sh
        language: script
        pass_filenames: false

  # ---- Pre-push: mirror CI's Test steps locally, so a red suite never
  # reaches `main` only to be caught by CI five minutes later. ----
  - repo: local
    hooks:
      - id: backend-pytest
        name: backend pytest
        entry: bash -c 'cd backend/oci && uv run pytest'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: cli-pytest
        name: cli pytest
        entry: bash -c 'cd cli/oci && uv run pytest'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: shared-pytest
        name: shared pytest
        entry: bash -c 'cd shared/oci && uv run pytest'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: mcp-pytest
        name: mcp pytest
        entry: bash -c 'cd mcp/oci && uv run pytest'
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-vitest
        name: frontend vitest
        entry: bash -c 'cd frontend/oci && npm test'
        language: system
        pass_filenames: false
        stages: [pre-push]
