# See https://pre-commit.com for usage and config.
# Run: pre-commit install (once) to install the pre-commit, commit-msg and
# pre-push hooks (see default_install_hook_types).
default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_language_version:
  python: python3.12
  node: "24.11.0"

repos:
  # ---- Generic hygiene ----
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: mixed-line-ending
        args: ["--fix=lf"]
      - id: detect-private-key

  # ---- Python: ruff (lint + format) ----
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.7.4
    hooks:
      - id: ruff
        args: ["--fix"]
        files: ^((backend|cli|shared|mcp)/oci|voice-agent)/
      - id: ruff-format
        files: ^((backend|cli|shared|mcp)/oci|voice-agent)/

  # ---- Python: mypy ----
  - repo: local
    hooks:
      - id: mypy
        name: mypy (backend)
        entry: bash -c 'cd backend/oci && uv run mypy src'
        language: system
        pass_filenames: false
        require_serial: true
        files: ^backend/oci/src/
      - id: mypy-cli
        name: mypy (cli)
        entry: bash -c 'cd cli/oci && uv run mypy src'
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(cli/oci/src/|shared/oci/src/)
      - id: mypy-shared
        name: mypy (shared)
        entry: bash -c 'cd shared/oci && uv run mypy src'
        language: system
        pass_filenames: false
        require_serial: true
        files: ^shared/oci/src/
      - id: mypy-mcp
        name: mypy (mcp)
        entry: bash -c 'cd mcp/oci && uv run mypy src'
        language: system
        pass_filenames: false
        require_serial: true
        files: ^(mcp/oci/src/|shared/oci/src/)
      - id: mypy-voice-agent
        name: mypy (voice-agent)
        entry: bash -c 'cd voice-agent && uv run mypy src'
        language: system
        pass_filenames: false
        require_serial: true
        files: ^voice-agent/src/

  # ---- Frontend: prettier ----
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        files: ^frontend/oci/.*\.(ts|tsx|js|jsx|json|css|scss|md|yaml|yml|html)$
        additional_dependencies:
          # Keep in lock-step with frontend/oci/package-lock.json, or the hook
          # and `npm run format:check` fight over formatting.
          - prettier@3.9.4

  # ---- Frontend: eslint ----
  - repo: https://github.com/pre-commit/mirrors-eslint
    rev: v9.14.0
    hooks:
      - id: eslint
        files: ^frontend/oci/.*\.(ts|tsx|js|jsx)$
        args: ["--config", "frontend/oci/eslint.config.js"]
        additional_dependencies:
          - eslint@9.14.0
          - typescript@5.6.3
          - typescript-eslint@8.13.0
          - "@eslint/js@9.14.0"

  # ---- Commit message: conventional commits ----
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: []

  # ---- Secret scanning ----
  # Runs an installed gitleaks rather than the upstream hook, which compiles
  # the binary from source with cgo. On macOS with Go 1.22 and the current
  # Xcode linker that build produces a Mach-O binary with no LC_UUID that
  # dyld refuses to exec, so the upstream hook cannot run there at all. CI
  # installs gitleaks before running pre-commit; see the script for the
  # local install.
  - repo: local
    hooks:
      - id: gitleaks
        name: Detect hardcoded secrets
        entry: scripts/gitleaks-staged.sh
        language: script
        pass_filenames: false

  # ---- Pre-push: run every CI job locally (scripts/ci-local.sh), so a red
  # suite never leaves the machine. Each hook fires only when the push touches
  # the same paths that trigger its workflow. The pre-commit workflow's hooks
  # are covered by `pre-commit run --all-files` below. ----
  - repo: local
    hooks:
      - id: ci-backend
        name: backend-ci (ruff, mypy, pytest)
        entry: scripts/ci-local.sh backend
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^(backend/oci/|\.github/workflows/backend-ci\.yml$|scripts/ci-local\.sh$)
      - id: ci-cli
        name: cli-ci (ruff, mypy, pytest)
        entry: scripts/ci-local.sh cli
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^(cli/oci/|shared/oci/|\.github/workflows/cli-ci\.yml$|scripts/ci-local\.sh$)
      - id: ci-shared
        name: shared-ci (ruff, mypy, pytest)
        entry: scripts/ci-local.sh shared
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^(shared/oci/|\.github/workflows/shared-ci\.yml$|scripts/ci-local\.sh$)
      - id: ci-mcp
        name: mcp-ci (ruff, mypy, pytest)
        entry: scripts/ci-local.sh mcp
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^(mcp/oci/|shared/oci/|shared/voice-tool-roster\.json$|\.github/workflows/mcp-ci\.yml$|scripts/ci-local\.sh$)
      - id: ci-voice-agent
        name: voice-agent-ci (ruff, mypy, pytest)
        entry: scripts/ci-local.sh voice-agent
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^(voice-agent/|shared/voice-tool-roster\.json$|\.github/workflows/voice-agent-ci\.yml$|scripts/ci-local\.sh$)
      - id: ci-frontend
        name: frontend-ci (prettier, eslint, tsc, vitest, build)
        entry: scripts/ci-local.sh frontend
        language: system
        pass_filenames: false
        require_serial: true
        stages: [pre-push]
        files: ^(frontend/oci/|shared/voice-tool-roster\.json$|\.github/workflows/frontend-ci\.yml$|scripts/ci-local\.sh$)
      - id: ci-pre-commit
        name: pre-commit-ci (all hooks, all files)
        entry: bash -c 'SKIP="${SKIP:+$SKIP,}ci-pre-commit" pre-commit run --all-files --hook-stage pre-commit'
        language: system
        pass_filenames: false
        always_run: true
        require_serial: true
        stages: [pre-push]
