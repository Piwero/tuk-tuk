apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-mcp
  namespace: tuk-tuk
spec:
  # Credentials for the MCP server (ADR 0016). The operator syncs this into
  # tuk-tuk as a Secret named tuk-tuk-mcp, which the Deployment loads via
  # envFrom.secretRef. Field labels become env var names verbatim.
  #
  # Expected item fields:
  #   TUK_PASSWORD     - the owner's tuk-tuk password (plaintext, not the
  #                      hash). The pod logs in with it and keeps the session
  #                      in memory only. Changing the password in Settings
  #                      requires updating this field too.
  #   MCP_BEARER_TOKEN - shared secret MCP clients send as a bearer token.
  #                      At least 32 characters or the server refuses to
  #                      start. Generate once: `openssl rand -hex 32`.
  itemPath: vaults/${TUK_TUK_1PASSWORD_VAULT_ID}/items/tuk-tuk-mcp
