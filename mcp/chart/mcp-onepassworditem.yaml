apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-mcp
  namespace: tuk-tuk
spec:
  # OBSOLETE since issue #525: images from #525 on never read this Secret.
  # The server needs only tuk-tuk-mcp-service (backend/chart), and each
  # client brings its own MCP token.
  #
  # Kept, and still loaded optionally by deployment.yaml, only so the
  # pre-#525 image (pinned until the next release) and a rollback to it
  # still start: they need TUK_API_TOKEN and MCP_BEARER_TOKEN from here.
  # Remove this file, its kustomization entry, the Deployment's optional
  # secretRef and the 1Password item in the cleanup step of
  # docs/self-hosting/shared-mcp-server.md, once the Admin has approved it.
  itemPath: vaults/${TUK_TUK_1PASSWORD_VAULT_ID}/items/tuk-tuk-mcp
