apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp
  namespace: tuk-tuk
spec:
  # One replica: each client's read-before-write allowlist lives in this
  # process's memory (ADR 0016, issue #525), so a second replica would refuse
  # writes the first one's reads allowed. One pod serves every User. Don't raise.
  replicas: 1
  selector:
    matchLabels:
      app: mcp
  template:
    metadata:
      labels:
        app: mcp
    spec:
      # The Service is named "mcp", so Kubernetes would inject legacy
      # MCP_PORT/MCP_SERVICE_* service-link env vars into this pod.
      enableServiceLinks: false
      imagePullSecrets:
        - name: tuk-tuk-ghcr
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      securityContext:
        runAsNonRoot: true
        # The image's `appuser` (useradd, first free uid). Numeric, because
        # runAsNonRoot cannot verify a user given by name.
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: mcp
          image: ghcr.io/piwero/tuk-tuk/mcp:3.1.1 # {"$imagepolicy": "tuk-tuk:mcp"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8901
          envFrom:
            - configMapRef:
                name: mcp-config
            # The service key only (issue #525): this pod's server holds no
            # User's credential. Each client brings its own MCP token.
            # Optional only while the pre-#525 image is still pinned, so it
            # keeps starting if this Secret syncs late; the new image refuses
            # to start without MCP_SERVICE_KEY anyway. Make it required in
            # the cleanup step.
            - secretRef:
                name: tuk-tuk-mcp-service
                optional: true
            # TRANSITIONAL, unread by images from #525 on: the pre-#525 image
            # still pinned below until the next release needs TUK_API_TOKEN and
            # MCP_BEARER_TOKEN from here, and a rollback needs them again.
            # Removed, with the Secret, in the approved cleanup step of
            # docs/self-hosting/shared-mcp-server.md.
            - secretRef:
                name: tuk-tuk-mcp
                optional: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          readinessProbe:
            httpGet:
              path: /health
              port: 8901
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8901
            initialDelaySeconds: 15
            periodSeconds: 30
