---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tuk-tuk-frontend-tailscale
  namespace: tuk-tuk
  annotations:
    tailscale.com/tags: "${TUK_TUK_TAILNET_TAGS}"
    tailscale.com/http-endpoint: "enabled"
    tailscale.com/funnel: "false"
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: frontend
      port:
        number: 80
  tls:
    - hosts:
        - tuk-tuk
