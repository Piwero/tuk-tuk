name: tuk-tuk

services:
  backend:
    build:
      context: ./backend/oci
      target: dev
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend/oci:/app

  frontend:
    build:
      context: ./frontend/oci
      target: dev
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./frontend/oci:/app
      - /app/node_modules
    depends_on:
      backend:
        condition: service_healthy
