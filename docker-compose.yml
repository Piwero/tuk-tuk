name: tuk-tuk

services:
  backend:
    build:
      context: ./backend/oci
      target: dev
    ports:
      - "8900:8900"
    env_file:
      - path: .env
        format: raw
    volumes:
      - ./backend/oci:/app

  frontend:
    build:
      context: .
      dockerfile: frontend/oci/Dockerfile
      target: dev
    ports:
      - "5900:5900"
    env_file:
      - path: .env
        format: raw
    volumes:
      - ./frontend/oci:/app/frontend/oci
      - ./shared:/app/shared:ro
      - /app/frontend/oci/node_modules
    depends_on:
      backend:
        condition: service_healthy
