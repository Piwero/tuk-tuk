name: tuk-tuk

services:
  # Local dev database with throwaway credentials. Published on
  # localhost:5433 (5432 is often a host Postgres already) so the backend
  # can also run outside Docker — see .env.example.
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: tuktuk
      POSTGRES_PASSWORD: tuktuk
      POSTGRES_DB: tuktuk
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tuktuk -d tuktuk"]
      interval: 2s
      timeout: 3s
      retries: 15

  backend:
    build:
      context: ./backend/oci
      target: dev
    ports:
      - "8900:8900"
    env_file:
      - path: .env
        format: raw
    # Set here, not from .env: inside Compose the database is always the
    # `postgres` service above, whatever .env says for running outside it.
    environment:
      DATABASE_URL: postgresql+psycopg://tuktuk:tuktuk@postgres:5432/tuktuk
    volumes:
      - ./backend/oci:/app
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/oci/Dockerfile
      target: dev
    ports:
      - "5900:5900"
    env_file:
      - path: .env
        format: raw
    volumes:
      - ./frontend/oci:/app/frontend/oci
      - ./shared:/app/shared:ro
      - /app/frontend/oci/node_modules
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
