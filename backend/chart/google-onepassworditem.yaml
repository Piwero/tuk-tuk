apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-google
  namespace: tuk-tuk
spec:
  # Holds the Google Calendar integration's secrets (issue #103/#105; ADR
  # 0006), synced into tuk-tuk as a Secret named tuk-tuk-google, which the
  # Deployment loads via secretRef alongside backend-config and tuk-tuk-auth.
  #
  # All three fields are optional as far as the app is concerned — absent,
  # the backend starts normally with the Google integration entirely
  # disabled (no UI trace). Once GOOGLE_CLIENT_ID/GOOGLE_CLIENT_SECRET are
  # both set, GOOGLE_ENCRYPTION_KEY becomes required or the app refuses to
  # start (app.config.Settings). Field names below must match Settings
  # exactly.
  #
  # Expected item fields:
  #   GOOGLE_CLIENT_ID       - from a Google Cloud OAuth client, with an
  #                            exact redirect URI registered for this
  #                            origin, and publishing status "In production"
  #                            (test-user refresh credentials on an
  #                            unverified app expire after seven days).
  #   GOOGLE_CLIENT_SECRET   - the matching OAuth client secret.
  #   GOOGLE_ENCRYPTION_KEY  - encrypts stored refresh credentials at rest.
  #                            A long random value generated once (e.g.
  #                            `openssl rand -base64 32`), never derived
  #                            from or shared with SECRET_KEY: rotating the
  #                            session signing key must never destroy a
  #                            connected Google account.
  itemPath: vaults/nx3o65ewnbd2khwhvat3pum6n4/items/tuk-tuk-google
