apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-mcp-service
  namespace: tuk-tuk
spec:
  # The shared MCP server's service key (issue #525, ADR 0016's amendment),
  # synced into tuk-tuk as a Secret named tuk-tuk-mcp-service. Both the
  # backend and the MCP Deployment (mcp/chart) load it with envFrom, so the
  # two always hold the same value.
  #
  # It names no User and acts as no one: it only lets the MCP server trade a
  # User's MCP token (tuk_mcp_..., which the User brings in their own MCP
  # client) for a two-minute access credential acting as that User. Without
  # a User's MCP token it reaches no data. Optional for the backend: while it
  # is absent the exchange answers 404 and no MCP token works.
  #
  # Expected item fields:
  #   MCP_SERVICE_KEY - at least 32 characters, generated once with
  #                     `openssl rand -hex 32`. Rotate it by changing the
  #                     item and restarting both Deployments; no client
  #                     needs to change.
  itemPath: vaults/${TUK_TUK_1PASSWORD_VAULT_ID}/items/tuk-tuk-mcp-service
