apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: tuk-tuk
data:
  BACKEND_LOG_LEVEL: "info"
  # Browser traffic arrives same-origin through the frontend nginx proxy, so
  # CORS only matters for direct calls to the backend's own Tailscale host.
  # Adjust the tailnet name to yours.
  CORS_ORIGINS: '["https://tuk-tuk.your-tailnet.ts.net"]'
  # SQLite on the PVC (ADR 0004). Not a secret — no credentials in the URL.
  # Four slashes: absolute path /data/tuk_tuk.db.
  DATABASE_URL: "sqlite+aiosqlite:////data/tuk_tuk.db"
