apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-git-auth
  namespace: tuk-tuk
spec:
  # Same 1Password item Flux uses in flux-system (github-auth-repos). Produces
  # a secret with `username` + `password` keys for the GitRepository below. The
  # image-automation-controller uses these creds to PUSH the image-bump commit,
  # so the PAT must have contents:write on Piwero/tuk-tuk (read alone is enough
  # to clone but not to push).
  itemPath: vaults/${TUK_TUK_1PASSWORD_VAULT_ID}/items/github-auth-repos
