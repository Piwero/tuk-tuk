apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-auth
  namespace: tuk-tuk
spec:
  # Holds the two authentication secrets consumed by the backend: a session
  # signing key and a password hash. The operator syncs this into tuk-tuk as
  # a Secret named tuk-tuk-auth, which the Deployment loads via secretRef
  # alongside the backend-config ConfigMap.
  #
  # The auth gate (#83/#84) now reads these env vars — the field names below
  # must match app.config.Settings exactly, or the fail-closed startup check
  # (#82) crash-loops the pod with no old one left serving traffic.
  #
  # Expected item fields:
  #   SECRET_KEY         - session signing key. A long random value generated
  #                        once (e.g. `openssl rand -base64 32`) and stored
  #                        here, never derived or regenerated at container
  #                        start: image automation restarts the pod on every
  #                        release, and a per-boot key would log every device
  #                        out several times a week.
  #   AUTH_PASSWORD_HASH - the Argon2id hash from
  #                        `mise run backend:hash-password`. If this item
  #                        still has a field named ADMIN_PASSWORD_HASH from
  #                        before the gate landed, rename it — the app looks
  #                        for AUTH_PASSWORD_HASH and won't start without it.
  itemPath: vaults/nx3o65ewnbd2khwhvat3pum6n4/items/tuk-tuk-auth
