apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-auth
  namespace: tuk-tuk
spec:
  # Holds the two authentication secrets consumed by the backend: a session
  # signing key and a password hash. The operator syncs this into tuk-tuk as
  # a Secret named tuk-tuk-auth, which the Deployment loads via secretRef
  # alongside the backend-config ConfigMap.
  #
  # Nothing in the app reads these env vars yet (#79 exists purely to satisfy
  # the ordering constraint: the config must be reconciled before any
  # fail-closed image rolls out, since replicas: 1 + Recreate means a missing
  # secret is a crash-loop with no old pod left serving traffic).
  #
  # Expected item fields:
  #   SECRET_KEY          - session signing key. A long random value
  #                         generated once (e.g. `openssl rand -base64 32`)
  #                         and stored here, never derived or regenerated at
  #                         container start: image automation restarts the
  #                         pod on every release, and a per-boot key would
  #                         log every device out several times a week.
  #   ADMIN_PASSWORD_HASH - PLACEHOLDER until the auth gate goes live. Must be
  #                         replaced with a real password hash before that
  #                         happens; keep the value obviously fake in the
  #                         meantime (e.g. "PLACEHOLDER-REPLACE-BEFORE-GO-LIVE").
  itemPath: vaults/nx3o65ewnbd2khwhvat3pum6n4/items/tuk-tuk-auth
