apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-auth
  namespace: tuk-tuk
spec:
  # Holds the authentication secrets consumed by the backend. The operator
  # syncs this into tuk-tuk as a Secret named tuk-tuk-auth, which the
  # Deployment loads via secretRef alongside the backend-config ConfigMap.
  #
  # The auth gate (#83/#84) reads these env vars — the field names below
  # must match app.config.Settings exactly, or the fail-closed startup check
  # (#82) crash-loops the pod with no old one left serving traffic.
  #
  # Since ADR 0008, the password hash and session signing key both live in
  # the DB-backed settings table (backend/oci/src/app/app_settings.py), not
  # env vars. AUTH_PASSWORD_HASH is consulted only on a pod's very first
  # boot ever, when no settings row exists yet, to seed that row's password
  # — after that it is never read again, even across restarts and
  # redeploys, since the settings table persists on the PVC. The session
  # key is never seeded from an env var at all: a fresh row always
  # generates its own random one. Changing the password via Settings in the
  # app updates the DB row directly and does NOT update this item; keeping
  # this item in sync with the app-set password is not required and, once a
  # settings row exists, has no effect. It only matters for a from-scratch
  # deployment (empty PVC) or as a documented break-glass recovery value.
  #
  # Expected item fields:
  #   APP_MASTER_KEY     - required unconditionally; the app refuses to
  #                        start without it (config.py). Encrypts sensitive
  #                        columns of the DB-backed settings table (the
  #                        Google client secret and stored refresh tokens).
  #                        A long random value generated once (e.g.
  #                        `openssl rand -base64 32`) and stored here, never
  #                        derived or regenerated at container start: image
  #                        automation restarts the pod on every release, and
  #                        a per-boot key would make the encrypted columns
  #                        undecryptable. This replaced the old SECRET_KEY
  #                        field — if this item still has SECRET_KEY, it is
  #                        dead and unread; add APP_MASTER_KEY instead.
  #   AUTH_PASSWORD_HASH - the Argon2id hash from
  #                        `mise run backend:hash-password`, used only to
  #                        seed the settings row's password on first boot
  #                        (see above). If this item still has a field
  #                        named ADMIN_PASSWORD_HASH from before the gate
  #                        landed, rename it — the app looks for
  #                        AUTH_PASSWORD_HASH and won't start without it on
  #                        a from-scratch deployment.
  itemPath: vaults/<YOUR_1PASSWORD_VAULT_ID>/items/tuk-tuk-auth
