apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: tuk-tuk
resources:
  - namespace.yaml
  - configmap.yaml
  - pvc.yaml
  - ghcr-onepassworditem.yaml
  - git-onepassworditem.yaml
  - auth-onepassworditem.yaml
  - google-onepassworditem.yaml
  - db-onepassworditem.yaml
  # copy-db-job.yaml is deliberately absent: a one-shot Job that Flux
  # re-applied would re-run a destructive copy. Applied by hand instead —
  # see the header of that file and README.md's "Moving to PostgreSQL".
  - imagerepository.yaml
  - imagepolicy.yaml
  - gitrepository.yaml
  - imageupdateautomation.yaml
  - deployment.yaml
  - service.yaml
  - tailscale-ingress.yaml
  - cf-ingressroute.yaml
  - cf-ingressroute-web-redirect.yaml
  - cf-middleware-redirect-to-https.yaml
