apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-sso
  namespace: tuk-tuk
spec:
  # Invite-only Google sign-in and invitation email (issue #586, ADR 0021),
  # synced into tuk-tuk as a Secret named tuk-tuk-sso, which the Deployment
  # loads with an optional secretRef: absent, the app runs exactly as
  # before, with password sign-in only and no invitations.
  #
  # Operator-managed, unlike a User's own Google client: never stored in the
  # database, never shown to anyone in the app.
  #
  # Expected item fields:
  #   GOOGLE_OAUTH_CLIENT_ID     - the shared Google Cloud OAuth client
  #                                (Web application). Register these exact
  #                                redirect URIs for https://${TUK_TUK_HOSTNAME}:
  #                                  /api/v1/auth/google/callback
  #                                  /api/v1/auth/google/link/callback
  #                                  /api/v1/google/callback
  #   GOOGLE_OAUTH_CLIENT_SECRET - its client secret.
  #   SMTP_HOST                  - optional; without it invitations are not
  #                                emailed and an Admin copies each link.
  #   SMTP_PORT                  - 587 for starttls (the default), 465 for ssl.
  #   SMTP_SECURITY              - starttls (default) or ssl. "none" is
  #                                refused outside APP_ENV=development.
  #   SMTP_USERNAME / SMTP_PASSWORD - the mail server's sign-in, if any.
  #   SMTP_FROM                  - the sender address, required with SMTP_HOST.
  itemPath: vaults/${TUK_TUK_1PASSWORD_VAULT_ID}/items/tuk-tuk-sso
