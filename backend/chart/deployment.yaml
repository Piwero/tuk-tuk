apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tuk-tuk
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the SQLite PVC is ReadWriteOnce and the app
  # is single-writer — the old pod must release the volume before the new one
  # starts. No init containers: the app runs Alembic migrations itself on
  # startup, and there is no separate DB service to wait for (ADR 0004).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: tuk-tuk-ghcr
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: backend
          image: ghcr.io/piwero/tuk-tuk/backend:0.1.0 # {"$imagepolicy": "tuk-tuk:backend"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: backend-config
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
