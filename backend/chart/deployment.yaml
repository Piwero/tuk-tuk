apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tuk-tuk
spec:
  replicas: 1
  # Recreate, not RollingUpdate: the SQLite PVC is ReadWriteOnce and the app
  # is single-writer — the old pod must release the volume before the new one
  # starts. No init containers: the app runs Alembic migrations itself on
  # startup, and there is no separate DB service to wait for (ADR 0004).
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # The Service is named "backend", so Kubernetes would inject
      # BACKEND_PORT=tcp://<clusterIP>:8900 as a legacy service-link env var,
      # which collides with the pydantic Settings.backend_port int field and
      # crashes the app on startup.
      enableServiceLinks: false
      imagePullSecrets:
        - name: tuk-tuk-ghcr
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: backend
          image: ghcr.io/piwero/tuk-tuk/backend:2.6.1 # {"$imagepolicy": "tuk-tuk:backend"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8900
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: tuk-tuk-auth
            # Optional, unlike tuk-tuk-auth: the Google Calendar integration
            # is meant to run absent (issue #103/#105; ADR 0006), so a
            # tuk-tuk-google Secret that doesn't exist yet must never
            # crash-loop the pod — it's provisioned only once the integration
            # is actually wanted (see backend/chart/README.md).
            - secretRef:
                name: tuk-tuk-google
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8900
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8900
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
