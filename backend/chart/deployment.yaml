apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tuk-tuk
spec:
  # One replica, and not only because of the PVC. Multi-replica is an
  # explicit "no" in ADR 0013, and the dangerous part fails silently: the
  # login throttle counts consecutive failures in process memory, so N
  # replicas behind a round-robin balancer weaken brute-force protection
  # ~N-fold with nothing surfaced. Migrations also run on every boot of
  # every replica with no advisory lock, and the Inbox seed is an unguarded
  # read-then-insert. Moving to PostgreSQL makes scaling *look* available.
  # It is not. Don't raise this.
  replicas: 1
  # Recreate, not RollingUpdate: the app is single-writer (the replicas: 1
  # reason above), and the leftover PVC below is ReadWriteOnce — the old pod
  # must release it before the new one starts.
  # No init containers: the app runs Alembic migrations itself on startup
  # (and fails fast, naming the host, if the database is unreachable — see
  # app.db.check_database_reachable), so there is nothing to wait for even
  # once the database is a separate server.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # The Service is named "backend", so Kubernetes would inject
      # BACKEND_PORT=tcp://<clusterIP>:8900 as a legacy service-link env var,
      # which collides with the pydantic Settings.backend_port int field and
      # crashes the app on startup.
      enableServiceLinks: false
      imagePullSecrets:
        - name: tuk-tuk-ghcr
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: backend
          image: ghcr.io/piwero/tuk-tuk/backend:3.1.1 # {"$imagepolicy": "tuk-tuk:backend"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8900
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: tuk-tuk-auth
            # Optional, unlike tuk-tuk-auth: the Google Calendar integration
            # is meant to run absent (issue #103/#105; ADR 0006), so a
            # tuk-tuk-google Secret that doesn't exist yet must never
            # crash-loop the pod — it's provisioned only once the integration
            # is actually wanted (see backend/chart/README.md).
            - secretRef:
                name: tuk-tuk-google
                optional: true
            # The only source of DATABASE_URL (PostgreSQL only, ADR 0017).
            # Required, like tuk-tuk-auth: without it the pod waits with the
            # missing Secret named rather than starting with no database.
            - secretRef:
                name: tuk-tuk-db
            # Optional: the shared MCP server's service key (issue #525). Absent,
            # the MCP token exchange is off and the rest of the app is unaffected.
            - secretRef:
                name: tuk-tuk-mcp-service
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8900
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8900
            initialDelaySeconds: 15
            periodSeconds: 30
          # No longer read by the app (PostgreSQL only, #407). The PVC is
          # kept as the SQLite file's point-in-time copy from the cutover
          # (#417) until it is removed on purpose — its reclaim policy is
          # Delete, so dropping pvc.yaml destroys the file.
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
