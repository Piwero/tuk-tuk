apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: tuk-tuk
spec:
  # One replica, and not only because of the PVC. Multi-replica is an
  # explicit "no" in ADR 0013, and the dangerous part fails silently: the
  # login throttle counts consecutive failures in process memory, so N
  # replicas behind a round-robin balancer weaken brute-force protection
  # ~N-fold with nothing surfaced. Migrations also run on every boot of
  # every replica with no advisory lock, and the Inbox seed is an unguarded
  # read-then-insert. Moving to PostgreSQL makes scaling *look* available.
  # It is not. Don't raise this.
  replicas: 1
  # Recreate, not RollingUpdate: the SQLite PVC is ReadWriteOnce and the app
  # is single-writer — the old pod must release the volume before the new one
  # starts. Still correct on PostgreSQL, for the replicas: 1 reason above.
  # No init containers: the app runs Alembic migrations itself on startup
  # (and fails fast, naming the host, if the database is unreachable — see
  # app.db.check_database_reachable), so there is nothing to wait for even
  # once the database is a separate server.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # The Service is named "backend", so Kubernetes would inject
      # BACKEND_PORT=tcp://<clusterIP>:8900 as a legacy service-link env var,
      # which collides with the pydantic Settings.backend_port int field and
      # crashes the app on startup.
      enableServiceLinks: false
      imagePullSecrets:
        - name: tuk-tuk-ghcr
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/arch
                    operator: In
                    values:
                      - amd64
      containers:
        - name: backend
          image: ghcr.io/piwero/tuk-tuk/backend:2.11.2 # {"$imagepolicy": "tuk-tuk:backend"}
          imagePullPolicy: Always
          ports:
            - containerPort: 8900
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: tuk-tuk-auth
            # Optional, unlike tuk-tuk-auth: the Google Calendar integration
            # is meant to run absent (issue #103/#105; ADR 0006), so a
            # tuk-tuk-google Secret that doesn't exist yet must never
            # crash-loop the pod — it's provisioned only once the integration
            # is actually wanted (see backend/chart/README.md).
            - secretRef:
                name: tuk-tuk-google
                optional: true
            # Also optional, and last on purpose: envFrom applies sources in
            # order and later ones win, so a DATABASE_URL in this Secret
            # overrides the SQLite default in backend-config. That override
            # is the entire PostgreSQL switching mechanism (ADR 0013) — the
            # ConfigMap stays pinned at the SQLite path, so reverting is
            # removing the field here rather than editing config back.
            # Absent until someone actually wants PostgreSQL, so it must
            # never crash-loop the pod, exactly like tuk-tuk-google.
            - secretRef:
                name: tuk-tuk-db
                optional: true
          readinessProbe:
            httpGet:
              path: /health
              port: 8900
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8900
            initialDelaySeconds: 15
            periodSeconds: 30
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backend-data
