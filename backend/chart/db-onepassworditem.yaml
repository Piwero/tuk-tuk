apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-db
  namespace: tuk-tuk
spec:
  # Holds the external PostgreSQL connection string (ADR 0013), synced into
  # tuk-tuk as a Secret named tuk-tuk-db, which the Deployment loads via
  # secretRef *after* the backend-config ConfigMap.
  #
  # That ordering is the whole switching mechanism. envFrom applies sources
  # in order and later ones win, so a DATABASE_URL here overrides the
  # SQLite default in configmap.yaml. The ConfigMap is therefore never
  # edited to switch databases — it stays pinned at the SQLite file, which
  # keeps it usable as the copy job's source URL and makes reverting a
  # matter of removing this field rather than reconstructing a path.
  #
  # Genuinely optional, like tuk-tuk-google and unlike tuk-tuk-auth: the
  # Deployment's secretRef for it sets optional: true, so this manifest can
  # land and reconcile before the 1Password item exists. Until it does, the
  # backend starts normally on SQLite. Creating the item does not switch
  # anything either — the pod must restart to re-read its environment.
  #
  # Expected item fields:
  #   DATABASE_URL - postgresql+psycopg://user:password@host:5432/dbname
  #                  The +psycopg driver suffix is required: psycopg3 drives
  #                  both the async application and sync Alembic from this
  #                  one string (ADR 0013), and app.db only accepts the
  #                  `postgresql` and `postgresql+psycopg` schemes.
  #                  This is the one field in the whole deployment that
  #                  carries a live credential in a URL, which is why it is
  #                  here and not in the ConfigMap.
  #
  # Before setting it, use Settings -> Database -> Test connection in the
  # running app. That probe reports reachability, credentials, server
  # version, and whether the target is empty, and saves nothing.
  #
  # See backend/chart/README.md, "Moving to PostgreSQL", for the full
  # cutover and rollback sequence.
  itemPath: vaults/${TUK_TUK_1PASSWORD_VAULT_ID}/items/tuk-tuk-db
