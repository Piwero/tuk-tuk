apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-db
  namespace: tuk-tuk
spec:
  # Holds the PostgreSQL connection string, synced into tuk-tuk as a Secret
  # named tuk-tuk-db — the Deployment's only source of DATABASE_URL, and a
  # required one (PostgreSQL only, ADR 0017). Prod points at the shared
  # postgres-supernova server through the tailnet egress Service
  # (postgres-egress-service.yaml).
  #
  # Expected item fields:
  #   DATABASE_URL - postgresql+psycopg://user:password@host:5432/dbname
  #                  The +psycopg driver suffix is required: psycopg3 drives
  #                  both the async application and sync Alembic from this
  #                  one string (ADR 0013); the app refuses to start on any
  #                  other scheme.
  #                  This is the one field in the whole deployment that
  #                  carries a live credential in a URL, which is why it is
  #                  here and not in the ConfigMap.
  #
  # Before changing it, use Settings -> Database -> Test connection in the
  # running app. That probe reports reachability, credentials, server
  # version, and whether the target is empty, and saves nothing. The pod
  # must restart to pick up a new value.
  itemPath: vaults/${TUK_TUK_1PASSWORD_VAULT_ID}/items/tuk-tuk-db
