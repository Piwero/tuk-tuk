apiVersion: onepassword.com/v1
kind: OnePasswordItem
metadata:
  name: tuk-tuk-ghcr
  namespace: tuk-tuk
type: kubernetes.io/dockerconfigjson
spec:
  # Same 1Password item piwero-web uses for GHCR pulls: a classic PAT with
  # read:packages scope (fine-grained PATs don't support GHCR). Reused across
  # namespaces — the operator syncs it into tuk-tuk as its own Secret.
  itemPath: vaults/${TUK_TUK_1PASSWORD_VAULT_ID}/items/${TUK_TUK_1PASSWORD_GHCR_ITEM_ID}
