version: 2

# Policy for every ecosystem:
#  - minor and patch bumps are batched into one PR per ecosystem/directory
#    (the "minor-and-patch" group); major bumps are not grouped, so each
#    opens its own PR.
#  - cooldown: a release must be at least 7 days old before Dependabot
#    proposes it, so yanked or broken releases are skipped.
updates:
  - package-ecosystem: "uv"
    directory: "/backend/oci"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "backend"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
      # Dependabot can't classify these as minor/patch (extras suffix or a
      # four-part date version), so they escape the group above. Match them
      # by name instead; this also batches their major bumps.
      odd-versioning:
        patterns:
          - "sqlalchemy*"
          - "psycopg*"
          - "types-python-dateutil"

  - package-ecosystem: "uv"
    directory: "/cli/oci"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "cli"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/shared/oci"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "shared"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "uv"
    directory: "/mcp/oci"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "mcp"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/frontend/oci"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/backend/oci"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    # python:3.15-slim has no wheels for httptools/uvloop and the slim image
    # has no compiler, so the image doesn't build (#507). Drop this once
    # those wheels exist and backend-ci's matrix covers 3.15.
    ignore:
      - dependency-name: "python"
        versions: [">=3.15"]
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/mcp/oci"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/frontend/oci"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
