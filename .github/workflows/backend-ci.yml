name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/oci/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/oci/**"
      - ".github/workflows/backend-ci.yml"
  # Reusable: release.yml calls this as a publish gate.
  workflow_call:

defaults:
  run:
    working-directory: backend/oci

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: backend/oci/uv.lock
          # Only what the runtime image ships (FROM python:3.14-slim in
          # backend/oci/Dockerfile): the backend runs nowhere else. Bump both
          # together; the image job below fails if the base has no wheels for
          # a locked dependency.
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      # The suite starts its own PostgreSQL through testcontainers (#407),
      # using the runner's Docker daemon — no service container needed.
      - name: Pytest
        run: uv run pytest -n auto --cov=app --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/oci/coverage.xml
          if-no-files-found: ignore

  # Build the prod image so a broken base bump (e.g. a Dependabot Python
  # bump with no wheels for a locked dependency, #507) fails the PR rather
  # than the self-hosting install.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: backend/oci
          file: backend/oci/Dockerfile
          target: prod
          push: false
          cache-from: type=gha,scope=backend-image
          cache-to: type=gha,mode=max,scope=backend-image
