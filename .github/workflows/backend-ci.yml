name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/oci/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/oci/**"
      - ".github/workflows/backend-ci.yml"
  # Reusable: release.yml calls this as a publish gate.
  workflow_call:

defaults:
  run:
    working-directory: backend/oci

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true
          cache-dependency-glob: backend/oci/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest --cov=app --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/oci/coverage.xml
          if-no-files-found: ignore
