name: backend-ci

on:
  push:
    branches: [main]
    paths:
      - "backend/oci/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/oci/**"
      - ".github/workflows/backend-ci.yml"
  # Reusable: release.yml calls this as a publish gate.
  workflow_call:

defaults:
  run:
    working-directory: backend/oci

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared by requires-python; 3.14 is what the
        # runtime image ships (backend/oci/Dockerfile).
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/oci/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest --cov=app --cov-report=xml

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/oci/coverage.xml
          if-no-files-found: ignore

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tuktuk
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          enable-cache: true
          cache-dependency-glob: backend/oci/uv.lock
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Pytest (PostgreSQL, opt-in job only)
        run: uv run pytest tests/test_postgres.py -v
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/tuktuk
