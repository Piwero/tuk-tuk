name: voice-agent-ci

on:
  push:
    branches: [main]
    paths:
      - "voice-agent/**"
      - "shared/voice-tool-roster.json"
      - ".github/workflows/voice-agent-ci.yml"
  pull_request:
    paths:
      - "voice-agent/**"
      - "shared/voice-tool-roster.json"
      - ".github/workflows/voice-agent-ci.yml"
  workflow_call:

defaults:
  run:
    working-directory: voice-agent

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: voice-agent/uv.lock
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest
