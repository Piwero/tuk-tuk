name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/oci/package-lock.json

      # The eslint hook runs the repo's flat config, whose imports resolve
      # from frontend/node_modules — install them or the hook cannot load it.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/oci

      # The gitleaks hook runs whatever `gitleaks` is on PATH instead of
      # building its own (see .pre-commit-config.yaml), so CI has to put one
      # there. A released binary, not a source build — that is the whole
      # point of the arrangement.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail

          # Resolved rather than hardcoded, so moving this job to an ARM
          # runner is a one-line `runs-on` change and not a 404 here.
          case "$(uname -m)" in
            x86_64) arch=x64 ;;
            aarch64 | arm64) arch=arm64 ;;
            *) echo "::error::no gitleaks release for $(uname -m)" >&2; exit 1 ;;
          esac
          asset="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"

          curl -fsSL --retry 3 -o "$asset" "${base}/${asset}"
          curl -fsSL --retry 3 -o checksums.txt \
            "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"

          # This binary is about to run over our own source, so verify the
          # download before trusting it. `sha256sum -c` is a no-op if the
          # asset name never matches a line, so assert the match first.
          grep " ${asset}\$" checksums.txt > expected.txt
          test -s expected.txt
          sha256sum -c expected.txt

          tar -xzf "$asset" gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks "$asset" checksums.txt expected.txt
          gitleaks version

      - uses: pre-commit/action@v3.0.1
