name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/oci/package-lock.json

      # The eslint hook runs the repo's flat config, whose imports resolve
      # from frontend/node_modules — install them or the hook cannot load it.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/oci

      # The gitleaks hook runs whatever `gitleaks` is on PATH instead of
      # building its own (see .pre-commit-config.yaml), so CI has to put one
      # there. A released binary, not a source build — that is the whole
      # point of the arrangement.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          set -euo pipefail
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz gitleaks
          install -m 0755 gitleaks /usr/local/bin/gitleaks
          rm -f gitleaks gitleaks.tar.gz
          gitleaks version

      - uses: pre-commit/action@v3.0.1
