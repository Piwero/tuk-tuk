name: pre-commit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/oci/package-lock.json

      # The eslint hook runs the repo's flat config, whose imports resolve
      # from frontend/node_modules — install them or the hook cannot load it.
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend/oci

      - uses: pre-commit/action@v3.0.1
