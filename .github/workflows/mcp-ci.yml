name: mcp-ci

on:
  push:
    branches: [main]
    paths:
      - "mcp/oci/**"
      - "shared/oci/**"
      - "shared/voice-tool-roster.json"
      - ".github/workflows/mcp-ci.yml"
  pull_request:
    paths:
      - "mcp/oci/**"
      - "shared/oci/**"
      - "shared/voice-tool-roster.json"
      - ".github/workflows/mcp-ci.yml"
  workflow_call:

defaults:
  run:
    working-directory: mcp/oci

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: mcp/oci/uv.lock
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy src
      - run: uv run pytest

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: mcp/oci/Dockerfile
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
