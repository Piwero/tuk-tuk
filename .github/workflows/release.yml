name: release

# Publish backend and frontend images to GHCR on version tags (e.g. v1.4.2).
# Tests must pass first (reuses the CI workflows as gates), then both images
# are built and pushed as a matched set with semver tags: 1.4.2, 1.4, 1, latest.
# Flux (see backend/chart + frontend/chart) picks new versions up from GHCR
# and commits the image bump back to main.
on:
  push:
    tags:
      - "v*"

jobs:
  # --- Gate: both suites must pass before anything is published ---
  test-backend:
    uses: ./.github/workflows/backend-ci.yml

  test-frontend:
    uses: ./.github/workflows/frontend-ci.yml

  # --- Build + push both images in parallel ---
  build-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend/oci
            target: prod
            build-args: ""
          - component: frontend
            context: frontend/oci
            target: runtime
            # Empty base URL = relative /api/... requests, served same-origin
            # by the nginx proxy in frontend/chart.
            build-args: |
              VITE_API_BASE_URL=
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Repo-scoped, lowercased automatically by the action.
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      # GHCR pushes and the buildx bootstrap occasionally fail with transient
      # errors (runner-side Docker daemon 500s, registry manifest-push denials
      # that clear on retry) unrelated to workflow config — retry both, up to
      # 3 attempts each, natively rather than via a third-party retry action.
      - name: Set up Docker Buildx (attempt 1)
        id: buildx1
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (attempt 2)
        id: buildx2
        if: steps.buildx1.outcome == 'failure'
        continue-on-error: true
        uses: docker/setup-buildx-action@v4

      - name: Set up Docker Buildx (attempt 3)
        id: buildx3
        if: steps.buildx1.outcome == 'failure' && steps.buildx2.outcome == 'failure'
        uses: docker/setup-buildx-action@v4

      - name: Build and push (attempt 1)
        id: build1
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.build-args }}
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (attempt 2)
        id: build2
        if: steps.build1.outcome == 'failure'
        continue-on-error: true
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.build-args }}
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push (attempt 3)
        id: build3
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: |
            ${{ matrix.build-args }}
            VITE_APP_VERSION=${{ steps.meta.outputs.version }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify build and push succeeded
        if: steps.build1.outcome == 'failure' && steps.build2.outcome == 'failure' && steps.build3.outcome == 'failure'
        run: |
          echo "::error::Build and push failed after 3 attempts"
          exit 1

  # --- Publish a GitHub Release whose notes are the CHANGELOG section for this tag ---
  github-release:
    needs: build-push
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Extract changelog section for this tag
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { grab=1; next }
            grab && /^## \[/       { exit }
            grab                   { print }
          ' CHANGELOG.md > release-notes.md
          echo "Extracted $(wc -l < release-notes.md) lines for $VERSION"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: release-notes.md
