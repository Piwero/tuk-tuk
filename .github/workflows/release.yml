name: release

# Publish backend and frontend images to GHCR on version tags (e.g. v1.4.2).
# Tests must pass first (reuses the CI workflows as gates), then both images
# are built and pushed as a matched set with semver tags: 1.4.2, 1.4, 1, latest.
# Flux (see backend/chart + frontend/chart) picks new versions up from GHCR
# and commits the image bump back to main.
on:
  push:
    tags:
      - "v*"

jobs:
  # --- Gate: both suites must pass before anything is published ---
  test-backend:
    uses: ./.github/workflows/backend-ci.yml

  test-frontend:
    uses: ./.github/workflows/frontend-ci.yml

  # --- Build + push both images in parallel ---
  build-push:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - component: backend
            context: backend/oci
            target: prod
            build-args: ""
          - component: frontend
            context: frontend/oci
            target: runtime
            # Empty base URL = relative /api/... requests, served same-origin
            # by the nginx proxy in frontend/chart.
            build-args: |
              VITE_API_BASE_URL=
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          # Repo-scoped, lowercased automatically by the action.
          images: ghcr.io/${{ github.repository }}/${{ matrix.component }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          build-args: ${{ matrix.build-args }}
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
