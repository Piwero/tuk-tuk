name: cli-ci

on:
  push:
    branches: [main]
    paths:
      - "cli/oci/**"
      - ".github/workflows/cli-ci.yml"
  pull_request:
    paths:
      - "cli/oci/**"
      - ".github/workflows/cli-ci.yml"
  # Reusable: release.yml calls this as a publish gate.
  workflow_call:

defaults:
  run:
    working-directory: cli/oci

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is the floor declared by requires-python; 3.14 is what the
        # runtime image ships (backend/oci/Dockerfile).
        python-version: ["3.12", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          enable-cache: true
          cache-dependency-glob: cli/oci/uv.lock
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff (lint)
        run: uv run ruff check .

      - name: Ruff (format check)
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Pytest
        run: uv run pytest
